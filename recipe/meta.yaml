{% set name = "graphql-core" %}
{% set version = "3.3.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-', '_')}}-{{ version }}.tar.gz
  sha256: fd3424e88af3f3211931c6ff96350f1cd9069cf0f1a31b9972899e35d39136b5

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation -vv
  # upstream requires-python >=3.10
  skip: true  # [py<310]

requirements:
  host:
    - python
    - pip
    - uv-build >=0.12,<0.13
  run:
    - python

test:
  imports:
    - graphql
  source_files:
    - pyproject.toml
    - tests
    - docs
  commands:
    - pip check
    - pytest -vv --tb=long
  requires:
    - pip
    - pytest >=9.1,<10
    - pytest-benchmark >=5.3,<6
    - pytest-describe >=3.2,<4
    - pytest-timeout >=2.4,<3
    - anyio >=4.15,<5

about:
  home: https://github.com/graphql-python/graphql-core
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: GraphQL implementation for Python, a port of GraphQL.js, the JavaScript reference implementation for GraphQL.
  description: |
    GraphQL-core 3 is a Python 3.10+ port of GraphQL.js,
    the JavaScript reference implementation for GraphQL,
    a query language for APIs created by Facebook.
  dev_url: https://github.com/graphql-python/graphql-core
  doc_url: https://graphql-core-3.readthedocs.io

extra:
  recipe-maintainers:
    - carlodri
    - bollwyvl
    - KingDarBoja
